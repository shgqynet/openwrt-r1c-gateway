# ==============================================================================
# /etc/r1c/site.conf — 现场配置（需求 §27）
#
# 每台 R1C 出厂/部署时写入唯一 Site ID。
# 严禁把多个站点配置成同一个 VPN 地址；PLC 网段可以重复（走 L3 路由，不桥接）。
# ==============================================================================

# 站点标识（需求 §26）：R1C-SITE-001 / 002 / 003 ...
SITE_ID="SITE000"
# 主机名对应：r1c-site-001（小写）
HOSTNAME="r1c-site-000"

# ---------------------------------------------------------------- PLC 网络（§9）
#
# 【设计原则】现场 PLC 网段不固定，因此**网段参数一律不编译进固件**。
#   改本文件后执行 `r1c-apply` 即可生效，无需重新编译、无需重启。
#
# PLC_ROLE 决定 R1C 在 PLC 网段里扮演什么角色（现场千差万别，两种都要支持）：
#   gateway — R1C 占用 PLC_GATEWAY（如 .1），作为 PLC 网段网关。
#             前提：现场 PLC/交换机把网关指向 R1C，或已加指向 R1C 的静态路由。
#   host    — R1C 只是网段内一台主机，占用 PLC_LOCAL_IP（如 .254），
#             现场原有网关不动，对现有网络零改动。
#             前提：现场已有网关需有到 VPN 网段的回程路由，否则工程师侧收不到回包。
PLC_ROLE="gateway"                # gateway | host
PLC_NETWORK="192.168.10.0/24"     # 现场 PLC 网段，可任意改
PLC_GATEWAY="192.168.10.1"        # gateway 模式下 R1C 占用的地址
PLC_LOCAL_IP="192.168.10.254"     # host 模式下 R1C 占用的地址
# 注意：本项**不会**被下发为 R1C 的默认网关。
#   R1C 的默认路由必须始终指向 WAN（4G / 手机热点），给 LAN 配 gateway 会产出
#   第二条默认路由与其竞争，导致 VPN 隧道自身断流。
#   这里仅供跨三层场景手工添加静态路由时参考，日常留空即可。
PLC_UPSTREAM_GW=""                  # 原样保留仅为兼容性，运行时不使用

# ---------------------------------------------------------------- 防护与地址转换（§20）
# PLC 侧能否访问公网（Internet）。工业现场通常禁止，默认 deny。
PLC_WAN_ACCESS="deny"             # deny | allow
# 工程师(VPN) 访问 PLC 时是否做源地址转换(SNAT/masquerade)：
#   auto — gateway 模式关闭（PLC 网关就是 R1C，回包天然经过它）；
#          host 模式开启（否则 PLC 回包会走现场原网关，而原网关没有到 VPN 的路由）
#   1 / 0 — 强制开 / 关
PLC_SNAT="auto"

# 多站点同网段（需求 §25）的地址映射：暂不实现，仅预留参数位。
# 将来若需在 VPN 侧做 NETMAP 1:1 映射，每站点填一个唯一虚拟网段。
# 留空 = 不做映射。
PLC_MAP_NETWORK=""
# PLC 健康检查列表（需求 §33/§34）：只做 ICMP + TCP 连通性，禁止任何写操作
# 格式: 每行 "名称|IP|类型|描述"，空行与 # 开头行忽略
#
# ⚠️ 不要用 bash 数组语法 PLC_DEVICES=(...) —— 设备上的 /bin/sh 是 busybox ash，
#    不支持数组，source 本文件会直接解析失败。
PLC_DEVICES="
S7-1500|192.168.10.30|s7|Line 1 Main PLC
S7-1200|192.168.10.20|s7|Line 1 Sub PLC
S7-300|192.168.10.10|s7|Legacy PLC
AB-PLC|192.168.10.40|ab|CompactLogix
"

# ---------------------------------------------------------------- VPN（§5/§8）
# VPN 网段同样可改，改完 r1c-apply 生效。
VPN_MODE="wireguard"          # wireguard | zerotier
VPN_PROFILE="site000"
# WireGuard 隧道地址（每站点唯一，可改）
VPN_ADDR="10.250.1.20/16"
# 对端 Hub 的公网端点，例：vpn.example.com:51820
WG_ENDPOINT=""
WG_PEER_PUBLIC_KEY=""
# 本端 WireGuard 的 AllowedIPs：决定**哪些目的地址走这条隧道**（据此添加路由）。
# 留空时按 VPN_ADDR 前缀推导（10.250.1.20/16 → 10.250.0.0/16）；
# VPN_ADDR 若为 /32（Hub 常这样分发单个地址）则无法推导，必须填本项，否则报错退出。
#   例：只让 VPN 网段走隧道 → WG_PEER_ALLOWED_IPS="10.0.0.0/24"
# ⚠️ 绝不可填 0.0.0.0/0：默认路由被指进隧道会掐断 WAN(手机热点)，隧道自身随即断流。
#
# 另需在本机之外做的一步：Hub 端必须在本站 peer 的 AllowedIPs 里写上 PLC_NETWORK
# （如 192.168.10.0/24），否则 Hub 不会把去往 PLC 网段的流量交给这台 R1C。
WG_PEER_ALLOWED_IPS=""
# NAT 后（4G/手机热点/CGNAT）必须开 keepalive（需求 §18）
WG_KEEPALIVE="25"

# ⚠️ 私钥**绝不写在本文件**——本文件会进公开仓库。
#    现场部署时把私钥写入下面的文件（600 权限），r1c-apply 从这里读取。
WG_PRIVATE_KEY_FILE="/etc/r1c/wg-private.key"

# 预共享密钥同样单独存文件（Hub 生成 client conf 时常带 PresharedKey 字段）。
# 缺失会导致握手失败，而日志通常只显示 handshake timeout，很难查。
WG_PRESHARED_KEY_FILE="/etc/r1c/wg-preshared.key"

# ZeroTier：需要向控制器通告的 PLC 子网（Managed Route）
ZT_NETWORK=""
ZT_ROUTE="192.168.10.0/24"

# ---------------------------------------------------------------- WAN（§12-§15）
# 上行优先级：写在前面的优先。**第一个在线且能出网的接口成为实际主用**，
# 其余自动降级为备份；主用恢复后自动切回。
#
# 可用关键字（对应 uci 接口名）：
#   ethernet  — 有线 WAN 口（network.wan，device eth0.2），现场有能上网的网线时排最前
#   usb4g     — USB 4G 模块（network.wan4g）。HiLink 类模块切换后是一张 USB 网卡，
#               由 cdc_ether / cdc_ncm 驱动，无需拨号（实测华为 E3131 即此类）
#   usbtether — 手机 USB 共享网络（network.wantether，rndis_host 驱动）
#   wifi      — 手机热点 STA（network.wwan，2.4G）
#
# ⚠️ 出厂顺序是"网线 > WiFi热点 > 4G > USB共享"，即 **4G 定位于备用**：
#    现场能上网的网线或手机热点优先，4G 只在前两者都断掉时顶上。
#    若某个站点打算让 4G 当主上行，把 usb4g 挪到前面即可。
#
#    热插拔说明：4G 模块可以先不插。r1c-apply 仍会为它建好接口并纳入切换策略
#    （处于待命/offline），插上后由 hotplug 自动接管，不必再跑一次 apply。
WAN_PRIORITY="ethernet wifi usb4g usbtether"

# 4G / USB 共享网络的网卡名：
#   auto — 自动探测（按驱动：cdc_ncm / huawei_cdc_ncm / cdc_ether → 4G；rndis_host → USB共享）
#   也可直接写死设备名，例如 eth1 / usb0（USB 网卡重插后内核编号可能变，优先用 auto）
WAN_4G_DEVICE="auto"          # auto | eth1 | usb0 ...
WAN_TETHER_DEVICE="auto"

# 自动切换使用哪种机制：
#   metric — 只给各接口设不同 metric，靠内核选路。**零依赖、开销最小（默认值）**
#            2026-10-08 真机实测：断 WiFi 主用 → 4G 立即顶上，隧道 0 秒恢复、
#            PLC 1.7ms 零丢包；主用恢复后自动切回。物理掉线场景完全够用。
#            识别不了"接口还 UP 但上层已经没网"（如手机热点欠费限速）。
#   mwan3  — 策略路由 + 主动 ping 探测，理论上能覆盖上面那种"假在线"。
#            ⚠️ 但本固件环境（24.10 + mwan3 2.11.16 + fw4）实测**探测不成立**：
#            接口每次都是 online 后 1~2 秒就 disconnecting，约 40 秒后 offline，
#            policy 长期 unreachable（已排除 flush_conntrack、family、ping 兼容性、
#            setuid/LD_PRELOAD、探测点可达性等因素，根因未定位）。
#            因此**不作为默认**；要用请自行验证，并在现场先确认 mwan3 status。
#   off    — 不做任何切换，维持现状
WAN_FAILOVER="metric"         # metric | mwan3 | off

# mwan3 的连通性探测目标（多个更稳，任一可达即判在线）。
# 用国内公共 DNS，别填 Hub 的地址 —— 探测点挂了会导致误判并把上行整体切走。
MWAN_TRACK_IPS="223.5.5.5 114.114.114.114 8.8.8.8"

WIFI_SSID=""
WIFI_KEY=""
MODEM_PROFILE=""              # 例如 quectel/ec20，见 profiles/modem/

# ---------------------------------------------------------------- 远程维护（§28-§30）
REMOTE_MAINTENANCE="disabled"   # disabled | enabled
REMOTE_TIMEOUT="manual"         # 30min | 1h | 2h | 4h | manual

# 是否允许从 VPN 侧打开 R1C 的管理后台（LuCI 走 HTTP 80，uhttpd 另有 443）。
#   allow — **出厂值**。连上 WG 就能用浏览器开后台改配置、开本地应急管理页。
#   deny  — 收窄到只能 SSH(22) 与 ping，管理面不开（现场要收口时改这个）。
#
# ⚠️ 出厂 allow 的前提是设备带出厂密码：
#    uci-defaults/93-r1c-root-password.sh 在首次开机时给 root 写入默认哈希，
#    所以开箱即用的设备不是空密码。下面那道「无密码则拒绝放行」的校验照旧保留，
#    任何一台 root 密码被清空的设备都不会被匿名登录。
# ⚠️ 出厂密码是公开的默认值 —— 现场部署后必须 passwd 改掉。
VPN_HTTP_ACCESS="allow"        # allow | deny

# ---------------------------------------------------------------- 自动应用（§27）
# r1c-gateway 启动时是否自动执行 r1c-apply。
#
# 出厂必须为 0：固件里的 site.conf 全是占位值，若开机即自动应用，
# LAN 地址会立刻被改成 192.168.10.1（而非 OpenWrt 默认的 192.168.1.1），
# 首次刷机的人按教程访问 192.168.1.1 打不开，极易误判为刷机失败。
#
# 现场填好真实 SITE_ID / 网段 / WireGuard 端点后，再改为 1，
# 或干脆保持 0、每次改完手动执行 r1c-apply —— 后者在调试期更安全。
AUTO_APPLY="0"                  # 1 = 自动应用 | 0 = 仅手动 r1c-apply

# ---------------------------------------------------------------- 检测参数（§16/§37）
CHECK_INTERVAL="30"             # 秒
INTERNET_TEST_HOST="1.1.1.1"
DNS_TEST_HOST="www.cloudflare.com"
