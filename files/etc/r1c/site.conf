# ==============================================================================
# /etc/r1c/site.conf — 现场配置（需求 §27）
#
# 每台 R1C 出厂/部署时写入唯一 Site ID。
# 严禁把多个站点配置成同一个 VPN 地址；PLC 网段可以重复（走 L3 路由，不桥接）。
# ==============================================================================

# 站点标识（需求 §26）：R1C-SITE-001 / 002 / 003 ...
SITE_ID="SITE000"
# 主机名对应：r1c-site-001（小写）
HOSTNAME="r1c-site-000"

# ---------------------------------------------------------------- PLC 网络（§9）
PLC_NETWORK="192.168.10.0/24"
PLC_GATEWAY="192.168.10.1"
# PLC 健康检查列表（需求 §33/§34）：只做 ICMP + TCP 连通性，禁止任何写操作
# 格式: "名称|IP|类型|描述"
PLC_DEVICES=(
    "S7-1500|192.168.10.30|s7|Line 1 Main PLC"
    "S7-1200|192.168.10.20|s7|Line 1 Sub PLC"
    "S7-300|192.168.10.10|s7|Legacy PLC"
    "AB-PLC|192.168.10.40|ab|CompactLogix"
)

# ---------------------------------------------------------------- VPN（§5/§8）
VPN_MODE="wireguard"          # wireguard | zerotier
VPN_PROFILE="site000"
# WireGuard 隧道地址（每站点唯一）
VPN_ADDR="10.250.1.20/16"
# ZeroTier：需要向控制器通告的 PLC 子网（Managed Route）
ZT_NETWORK=""
ZT_ROUTE="192.168.10.0/24"
# NAT 后的移动网络必须开 keepalive（需求 §18）
WG_KEEPALIVE="25"

# ---------------------------------------------------------------- WAN（§12-§15）
# 优先级: 1 ethernet  2 usb4g  3 usbtether  4 wifi
WAN_PRIORITY="ethernet usb4g usbtether wifi"
WIFI_SSID=""
WIFI_KEY=""
MODEM_PROFILE=""              # 例如 quectel/ec20，见 profiles/modem/

# ---------------------------------------------------------------- 远程维护（§28-§30）
REMOTE_MAINTENANCE="disabled"   # disabled | enabled
REMOTE_TIMEOUT="manual"         # 30min | 1h | 2h | 4h | manual

# ---------------------------------------------------------------- 检测参数（§16/§37）
CHECK_INTERVAL="30"             # 秒
INTERNET_TEST_HOST="1.1.1.1"
DNS_TEST_HOST="www.cloudflare.com"
