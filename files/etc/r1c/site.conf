# ==============================================================================
# /etc/r1c/site.conf — 现场配置（需求 §27）
#
# 每台 R1C 出厂/部署时写入唯一 Site ID。
# 严禁把多个站点配置成同一个 VPN 地址；PLC 网段可以重复（走 L3 路由，不桥接）。
# ==============================================================================

# 站点标识（需求 §26）：R1C-SITE-001 / 002 / 003 ...
SITE_ID="SITE000"
# 主机名对应：r1c-site-001（小写）
HOSTNAME="r1c-site-000"

# ---------------------------------------------------------------- PLC 网络（§9）
#
# 【设计原则】现场 PLC 网段不固定，因此**网段参数一律不编译进固件**。
#   改本文件后执行 `r1c-apply` 即可生效，无需重新编译、无需重启。
#
# PLC_ROLE 决定 R1C 在 PLC 网段里扮演什么角色（现场千差万别，两种都要支持）：
#   gateway — R1C 占用 PLC_GATEWAY（如 .1），作为 PLC 网段网关。
#             前提：现场 PLC/交换机把网关指向 R1C，或已加指向 R1C 的静态路由。
#   host    — R1C 只是网段内一台主机，占用 PLC_LOCAL_IP（如 .254），
#             现场原有网关不动，对现有网络零改动。
#             前提：现场已有网关需有到 VPN 网段的回程路由，否则工程师侧收不到回包。
PLC_ROLE="gateway"                # gateway | host
PLC_NETWORK="192.168.10.0/24"     # 现场 PLC 网段，可任意改
PLC_GATEWAY="192.168.10.1"        # gateway 模式下 R1C 占用的地址
PLC_LOCAL_IP="192.168.10.254"     # host 模式下 R1C 占用的地址
PLC_UPSTREAM_GW="192.168.10.1"    # host 模式下现场现有网关（R1C 的默认网关）

# ---------------------------------------------------------------- 防护与地址转换（§20）
# PLC 侧能否访问公网（Internet）。工业现场通常禁止，默认 deny。
PLC_WAN_ACCESS="deny"             # deny | allow
# 工程师(VPN) 访问 PLC 时是否做源地址转换(SNAT/masquerade)：
#   auto — gateway 模式关闭（PLC 网关就是 R1C，回包天然经过它）；
#          host 模式开启（否则 PLC 回包会走现场原网关，而原网关没有到 VPN 的路由）
#   1 / 0 — 强制开 / 关
PLC_SNAT="auto"

# 多站点同网段（需求 §25）的地址映射：暂不实现，仅预留参数位。
# 将来若需在 VPN 侧做 NETMAP 1:1 映射，每站点填一个唯一虚拟网段。
# 留空 = 不做映射。
PLC_MAP_NETWORK=""
# PLC 健康检查列表（需求 §33/§34）：只做 ICMP + TCP 连通性，禁止任何写操作
# 格式: 每行 "名称|IP|类型|描述"，空行与 # 开头行忽略
#
# ⚠️ 不要用 bash 数组语法 PLC_DEVICES=(...) —— 设备上的 /bin/sh 是 busybox ash，
#    不支持数组，source 本文件会直接解析失败。
PLC_DEVICES="
S7-1500|192.168.10.30|s7|Line 1 Main PLC
S7-1200|192.168.10.20|s7|Line 1 Sub PLC
S7-300|192.168.10.10|s7|Legacy PLC
AB-PLC|192.168.10.40|ab|CompactLogix
"

# ---------------------------------------------------------------- VPN（§5/§8）
# VPN 网段同样可改，改完 r1c-apply 生效。
VPN_MODE="wireguard"          # wireguard | zerotier
VPN_PROFILE="site000"
# WireGuard 隧道地址（每站点唯一，可改）
VPN_ADDR="10.250.1.20/16"
# 对端 Hub 的公网端点，例：vpn.example.com:51820
WG_ENDPOINT=""
WG_PEER_PUBLIC_KEY=""
# 向对端宣告的本站 PLC 子网（一般等于 PLC_NETWORK）
WG_PEER_ALLOWED_IPS=""
# NAT 后（4G/手机热点/CGNAT）必须开 keepalive（需求 §18）
WG_KEEPALIVE="25"

# ⚠️ 私钥**绝不写在本文件**——本文件会进公开仓库。
#    现场部署时把私钥写入下面的文件（600 权限），r1c-apply 从这里读取。
WG_PRIVATE_KEY_FILE="/etc/r1c/wg-private.key"

# ZeroTier：需要向控制器通告的 PLC 子网（Managed Route）
ZT_NETWORK=""
ZT_ROUTE="192.168.10.0/24"

# ---------------------------------------------------------------- WAN（§12-§15）
# 优先级: 1 ethernet  2 usb4g  3 usbtether  4 wifi
WAN_PRIORITY="ethernet usb4g usbtether wifi"
WIFI_SSID=""
WIFI_KEY=""
MODEM_PROFILE=""              # 例如 quectel/ec20，见 profiles/modem/

# ---------------------------------------------------------------- 远程维护（§28-§30）
REMOTE_MAINTENANCE="disabled"   # disabled | enabled
REMOTE_TIMEOUT="manual"         # 30min | 1h | 2h | 4h | manual

# ---------------------------------------------------------------- 自动应用（§27）
# r1c-gateway 启动时是否自动执行 r1c-apply。
# 校验不通过时会自动跳过，不会把残缺配置写进网络。
AUTO_APPLY="1"                  # 1 = 自动应用 | 0 = 仅手动 r1c-apply

# ---------------------------------------------------------------- 检测参数（§16/§37）
CHECK_INTERVAL="30"             # 秒
INTERNET_TEST_HOST="1.1.1.1"
DNS_TEST_HOST="www.cloudflare.com"
