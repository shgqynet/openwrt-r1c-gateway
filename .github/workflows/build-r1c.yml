# ==============================================================================
# R1C Industrial Remote Gateway — GitHub Actions 云端构建
#
# 基于 P3TERX/Actions-OpenWrt 思路，针对本项目改造：
#   - 目标改为 ramips/mt7620 -> xiaomi_miwifi-mini（去掉 VMDK/ESXi 步骤）
#   - 配置走 configs/r1c-gateway.config（而非仓库根 .config）
#   - 源码 commit 锁定（工业固件必须可复现，不追 master）
#   - 增加固件大小检查，超阈值直接 BUILD FAILED（需求 §44）
#   - 增加 ccache 缓存加速增量构建
#
# ⚠️ GitHub-hosted runner（2026 官方规格）：
#     公开仓库: 4 vCPU / 16 GB RAM / 14 GB SSD（免费无限分钟）
#     私有仓库: 2 vCPU /  8 GB RAM / 14 GB SSD（消耗配额）
#     14 GB SSD 是主要瓶颈 → 必须执行 free-disk-space，且不要加回大型插件
# ==============================================================================
name: R1C Gateway Builder

on:
  workflow_dispatch:
    inputs:
      force_unlock:
        description: '忽略 source.commit 锁定，使用分支最新代码'
        type: boolean
        default: false
  push:
    paths:
      - 'configs/**'
      - 'files/**'
      - 'package/**'
      - 'patches/**'
      - 'diy-part1.sh'
      - 'diy-part2.sh'
      - 'diy-part2.d/**'
      - '.github/workflows/build-r1c.yml'

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: configs/r1c-gateway.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 14 GB SSD 不够用，必须清理预装的大型工具链
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint \
          binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
          fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man \
          intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
          libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev \
          libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build \
          p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools \
          qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
          unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        echo "BUILD_VERSION=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV
        sudo mkdir -p /workdir
        sudo chown "$USER:$GROUPS" /workdir
        df -hT /workdir

    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: /workdir/.ccache
        key: r1c-ccache-${{ runner.os }}-${{ hashFiles('configs/r1c-gateway.config') }}
        restore-keys: r1c-ccache-${{ runner.os }}-

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        if [ "${{ inputs.force_unlock }}" != "true" ] && [ -f "$GITHUB_WORKSPACE/source.commit" ]; then
          LOCKED=$(tr -d ' \t\r\n' < "$GITHUB_WORKSPACE/source.commit")
          git fetch --depth 1 origin "$LOCKED"
          git checkout -f "$LOCKED"
          echo "✅ 锁定 commit: $LOCKED"
        else
          echo "⚠️  未锁定，使用 $REPO_BRANCH 最新 HEAD: $(git rev-parse HEAD)"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/source.commit"
        fi
        ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

    - name: Load custom feeds
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update and install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        cd openwrt
        cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
        chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    - name: Download package
      id: package
      timeout-minutes: 60
      run: |
        cd openwrt
        make defconfig
        # ⚠️ 快速失败：defconfig 之后立刻确认中文包真的被选中。
        # 第 9 次构建（37490730637）的教训：.config 里 `CONFIG_X=y   # 注释`
        # 会被 kconfig 静默忽略，包"看着选中"实则是 n，编译一路全绿，
        # 结果 90 分钟后 rootfs 里一个 lmo 都没有才暴露。这里提前到 1 分钟内拦下。
        echo "--- defconfig 后 i18n 生效检查 ---"
        I18N_MISS=0
        for p in \
          luci-i18n-base-zh-cn \
          luci-i18n-firewall-zh-cn \
          luci-i18n-package-manager-zh-cn \
          luci-i18n-mwan3-zh-cn
        do
          if grep -q "^CONFIG_PACKAGE_${p}=y$" .config; then
            echo "  ✅ $p"
          else
            echo "  ❌ $p 未生效（.config 中相关行 $(grep -c "CONFIG_PACKAGE_${p}" .config) 条）"
            I18N_MISS=$((I18N_MISS+1))
          fi
        done
        echo "  --- .config 中所有 i18n / LUCI_LANG 行 ---"
        grep -E "^CONFIG_PACKAGE_luci-i18n|^CONFIG_LUCI_LANG" .config | sed 's/^/    /'
        if [ "$I18N_MISS" -ne 0 ]; then
          echo "::error::defconfig 后有 $I18N_MISS 个中文包未生效，立即中止（不要等 90 分钟）"
          exit 1
        fi
        # defconfig 会覆盖版本号，必须在其后注入
        sed -i '/^CONFIG_VERSION_NUMBER=/d' .config
        echo "CONFIG_VERSION_NUMBER=\"${{ env.BUILD_VERSION }}\"" >> .config
        # 启用 ccache（依赖 /workdir/.ccache）
        echo "CONFIG_CCACHE=y" >> .config
        echo "CONFIG_CCACHE_DIR=\"/workdir/.ccache\"" >> .config
        make defconfig
        make download -j8
        find dl -size -1024c -exec rm -f {} \;
        make download -j1 V=s || (sleep 3 && make download -j1 V=s)
        df -hT /workdir

    - name: Compile the firmware
      id: compile
      timeout-minutes: 300
      run: |
        cd openwrt
        echo "使用 $(nproc) 线程编译"
        LOG="$GITHUB_WORKSPACE/build.log"
        # tee 捕获日志供 release 归档；注意 pipeline 的退出码来自 tee，
        # 必须取 PIPESTATUS[0] 才能拿到 make 的真实结果。
        make -j$(nproc) 2>&1 | tee "$LOG"
        if [ "${PIPESTATUS[0]}" -ne 0 ]; then
          echo "::warning::并行编译失败，降级为 -j1 V=s 重试"
          make -j1 V=s 2>&1 | tee -a "$LOG"
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "❌ 编译失败"
            tail -n 200 "$LOG"
            exit 1
          fi
        fi
        du -h "$LOG"
        echo "status=success" >> $GITHUB_OUTPUT
        df -hT /workdir

    # 防呆：曾经发生过「构建成功但自研工具不在固件里」的静默缺失——
    # 包被选中、编译通过，却因 install 段漏登记文件而丢失，不报错、极难发现。
    # 这里在打包前直接对着 rootfs 逐个点名，缺一个就让构建失败。
    - name: Verify r1c-gateway files landed in rootfs
      id: verifyfiles
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt
        ROOTFS=$(ls -d build_dir/target-*/root-ramips 2>/dev/null | head -1)
        if [ -z "$ROOTFS" ]; then
          echo "❌ 未找到 rootfs 目录"; exit 1
        fi
        echo "rootfs: $ROOTFS"
        MISSING=0
        for f in \
          usr/bin/r1c-apply \
          usr/bin/r1c-status \
          usr/bin/r1c-diagnose \
          usr/bin/r1c-test-plc \
          usr/bin/r1c-wg-watchdog \
          etc/init.d/r1c-gateway \
          etc/r1c/site.conf \
          etc/uci-defaults/90-r1c-wireless-sta.sh \
          etc/uci-defaults/91-r1c-luci-lang.sh
        do
          if [ -e "$ROOTFS/$f" ]; then
            echo "  ✅ $f"
          else
            echo "  ❌ 缺失 $f  —— 检查 package/r1c-gateway/Makefile 的 install 段是否登记"
            MISSING=$((MISSING+1))
          fi
        done
        if [ "$MISSING" -ne 0 ]; then
          echo "::error::rootfs 缺少 $MISSING 个 r1c 文件，中止发布"
          exit 1
        fi
        # ⚠️ 存在 ≠ 可用。脚本没有执行位时，构建全绿但真机
        #   ash: r1c-apply: Permission denied (exit 126)
        # 2026-10-06 真机踩到：rootfs overlay 覆盖了 package install 的 0755。
        echo "--- 可执行位检查 ---"
        PERMFAIL=0
        for f in \
          usr/bin/r1c-apply \
          usr/bin/r1c-status \
          usr/bin/r1c-diagnose \
          usr/bin/r1c-test-plc \
          usr/bin/r1c-wg-watchdog \
          etc/init.d/r1c-gateway \
          etc/uci-defaults/90-r1c-wireless-sta.sh \
          etc/uci-defaults/91-r1c-luci-lang.sh
        do
          if [ -x "$ROOTFS/$f" ]; then
            echo "  ✅ -x $f"
          else
            echo "  ❌ 无执行位 $f (mode $(stat -c%a "$ROOTFS/$f" 2>/dev/null))"
            PERMFAIL=$((PERMFAIL+1))
          fi
        done
        if [ "$PERMFAIL" -ne 0 ]; then
          echo "::error::$PERMFAIL 个脚本缺少执行位，真机会 Permission denied，中止发布"
          exit 1
        fi
        # LuCI 中文包：CONFIG_PACKAGE_luci-i18n-*-zh-cn=y 只代表"被选中"，
        # 不代表 lmo 真的落地。用 *.zh-cn.lmo 计数校验，不依赖具体路径。
        echo "--- LuCI 中文语言包 ---"
        ZH=$(find "$ROOTFS" -name '*.zh-cn.lmo' 2>/dev/null | wc -l)
        find "$ROOTFS" -name '*.zh-cn.lmo' 2>/dev/null | sed 's|.*/|  ✅ |'
        if [ "$ZH" -eq 0 ]; then
          echo "::error::rootfs 中没有任何 .zh-cn.lmo，中文语言包未落地，中止发布"
          exit 1
        fi
        echo "  共 $ZH 个中文语言文件"
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Firmware size check (需求 §44)
      id: sizecheck
      if: steps.verifyfiles.outputs.status == 'success'
      run: |
        cd openwrt
        BIN=$(ls bin/targets/ramips/mt7620/*miwifi-mini*squashfs-sysupgrade.bin 2>/dev/null | head -1)
        if [ -z "$BIN" ]; then
          echo "❌ 未找到 sysupgrade 镜像"; exit 1
        fi
        bash "$GITHUB_WORKSPACE/scripts/check-size.sh" "$BIN" 15872
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Generate release package
      id: release
      if: steps.sizecheck.outputs.status == 'success'
      run: |
        cd openwrt
        bash "$GITHUB_WORKSPACE/scripts/make-release.sh" \
          "$GITHUB_WORKSPACE/openwrt/bin/targets/ramips/mt7620" "${{ env.BUILD_VERSION }}"
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      if: steps.release.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      with:
        name: r1c-gateway-${{ env.BUILD_VERSION }}
        path: releases/r1c-gateway-${{ env.BUILD_VERSION }}
        retention-days: 90

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      if: steps.release.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.BUILD_VERSION }}
        name: "R1C Gateway ${{ env.BUILD_VERSION }}"
        body: |
          Device: Xiaomi MiWiFi Mini (R1C)
          Target: ramips/mt7620 (mipsel_24kc)
          Source: openwrt/openwrt (openwrt-24.10) @ ${{ github.sha }}
        files: releases/r1c-gateway-${{ env.BUILD_VERSION }}/*

    # 注意：不删除历史 Release —— 工业固件需要可追溯的版本归档
    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 7
        keep_minimum_runs: 5
